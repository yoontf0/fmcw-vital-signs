[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fmcw-vitals"
version = "0.1.0"
description = "FMCW radar signal processing for non-contact vital signs monitoring (physics-based simulation + DSP pipeline)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hongeun Yoon" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
